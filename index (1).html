<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardView — 24/7 CCTV Monitoring &amp; Security</title>
<style>
  html,body{margin:0;height:100%;background:#0B1B33;color:#fff;font-family:Arial,Helvetica,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;text-align:center;padding:20px}
  a{color:#7db7ff}
</style>
<script>
(function () {
  var MOBILE_PAGE  = "mobile.html";
  var DESKTOP_PAGE = "desktop.html";

  // Manual override: ?view=mobile or ?view=desktop
  var params = new URLSearchParams(location.search);
  var forced = params.get("view");

  var ua = navigator.userAgent || "";
  var isMobileUA = /Android|iPhone|iPod|Windows Phone|Mobile|Opera Mini|IEMobile/i.test(ua);
  // iPads / tablets are treated as desktop unless UA says Mobile
  var isSmallScreen = Math.min(screen.width, screen.height) < 600 || window.innerWidth < 768;
  var isTouchPhone = ("ontouchstart" in window) && isSmallScreen;

  var target;
  if (forced === "mobile") target = MOBILE_PAGE;
  else if (forced === "desktop") target = DESKTOP_PAGE;
  else target = (isMobileUA || isTouchPhone) ? MOBILE_PAGE : DESKTOP_PAGE;

  location.replace(target);
})();
</script>
</head>
<body>
  <div class="wrap">
    <div>Loading GuardView…</div>
    <noscript>
      <div>
        <a href="desktop.html">Desktop version</a> &nbsp;|&nbsp; <a href="mobile.html">Mobile version</a>
      </div>
    </noscript>
  </div>
</body>
</html>
